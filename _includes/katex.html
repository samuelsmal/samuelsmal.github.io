<!-- Math rendering via KaTeX (enabled per-page with `math: true` in front matter) -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous">
<script defer
        src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
        crossorigin="anonymous"></script>
<script defer
        src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        crossorigin="anonymous"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    renderMathInElement(document.body, {
      // kramdown rewrites $$...$$ into \(...\) (inline) and \[...\] (display)
      // before KaTeX runs, so we match those. Single $ is intentionally NOT a
      // delimiter — it would collide with literal currency like $14.54.
      delimiters: [
        { left: "\\[", right: "\\]", display: true },
        { left: "\\(", right: "\\)", display: false }
      ],
      throwOnError: false,
      // KaTeX has no siunitx support, so approximate the three commands we
      // actually use. Typography only: upright roman units, thin space between
      // number and unit. Unit names are written literally (`m/s`), not as
      // siunitx control sequences (`\metre\per\second`).
      //
      // The thin space is explicit (`\,`) rather than implied by `\mathop`, and
      // the body is wrapped in braces, so these stay usable as a bare sub- or
      // superscript argument (`x_\unit{h}`). Without the braces the script
      // grabs only the first token and the whole expression fails to parse.
      macros: {
        "\\unit": "{\\,\\mathrm{#1}}",
        "\\qty": "{#1\\,\\mathrm{#2}}",
        "\\per": "/"
      }
    });
  });
</script>
